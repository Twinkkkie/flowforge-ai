apiVersion: v1
kind: ConfigMap
metadata:
  name: flowforge-config
data:
  APP_ENV: "production"
  HTTP_TIMEOUT_SECONDS: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowforge-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowforge-api
  template:
    metadata:
      labels:
        app: flowforge-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/flowforge-ai:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8020"]
          ports:
            - containerPort: 8020
          envFrom:
            - configMapRef:
                name: flowforge-config
            - secretRef:
                name: flowforge-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8020
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8020
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowforge-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowforge-worker
  template:
    metadata:
      labels:
        app: flowforge-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/example/flowforge-ai:latest
          command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO"]
          envFrom:
            - configMapRef:
                name: flowforge-config
            - secretRef:
                name: flowforge-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: flowforge-api
spec:
  selector:
    app: flowforge-api
  ports:
    - port: 80
      targetPort: 8020
